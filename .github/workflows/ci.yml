name: Kontrol

# Her pushta ve PR'da tip, lint ve birim testleri çalışır.
# Derleme (next build) Sites/Vercel tarafında yapılıyor; burada Supabase
# anahtarı gerekmez — kontroller saf mantık ve statik analizle sınırlı.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipler
        run: npx tsc --noEmit
      # npm run lint, proje kapsamlı HOME/npm yolları kuran
      # scripts/sites-env.sh üzerinden geçiyor; bu CI'da gereksiz, eslint
      # doğrudan aynı argümanlarla çalıştırılıyor.
      - name: Lint
        run: npx eslint . --ignore-pattern dist --ignore-pattern .next
      - name: Birim testleri
        run: npm run test:unit
      # Canlı şemanın anlık görüntüsü (supabase/schema/canli-sema.sql) PGlite'a
      # kurulur; teklif → imza → iş → tahsilat akışı gerçek fonksiyon ve
      # tetikleyicilerle, müşterinin ve personelin rolleriyle koşar.
      - name: Veritabanı akış testleri
        run: npm run test:db
      # Yeni migration adı ve sürüm sırası (scripts/check-migrations.mjs).
      # Migration'lar SQL Editor'den elle uygulanıyor; sıralama hatası ancak
      # burada yakalanır.
      - name: Migration denetimi
        run: npm run check:migrations
      # Koddaki tablo/sütun/fonksiyon adları canlı şemada var mı
      # (supabase/schema/katalog.json). Supabase istemcisi tipsiz; yanlış
      # sütun adı derlemede görünmez, üretimde sessizce boş veri döndürür.
      - name: Şema sözleşmesi
        run: npm run check:schema
