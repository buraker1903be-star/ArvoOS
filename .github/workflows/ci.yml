name: Kontrol

# Her pushta ve PR'da tip, lint ve birim testleri çalışır.
# Derleme (next build) Vercel tarafında yapılıyor; burada Supabase
# anahtarı gerekmez — kontroller saf mantık ve statik analizle sınırlı.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipler
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Birim testleri
        run: npm run test:unit
      # Canlı şemanın anlık görüntüsü (supabase/schema/canli-sema.sql) PGlite'a
      # kurulur; teklif → imza → iş → tahsilat akışı gerçek fonksiyon ve
      # tetikleyicilerle, müşterinin ve personelin rolleriyle koşar.
      - name: Veritabanı akış testleri
        run: npm run test:db
      # Yeni migration adı ve sürüm sırası (scripts/check-migrations.mjs).
      # Migration'lar SQL Editor'den elle uygulanıyor; sıralama hatası ancak
      # burada yakalanır.
      - name: Migration denetimi
        run: npm run check:migrations
      # tests/db düzeneği migration dosyalarını dökümün üstüne yeniden
      # uyguluyor; listede eski bir dosya kalırsa bir işlevin gövdesi
      # eskiye döner ve test üretimde olmayan davranışı yeşil sınar.
      # 09.10.2026'da bir üretim hatasını iki gün gizledi.
      - name: Düzenek denetimi
        run: npm run check:db-testleri
      # Koddaki tablo/sütun/fonksiyon adları canlı şemada var mı
      # (supabase/schema/katalog.json). Supabase istemcisi tipsiz; yanlış
      # sütun adı derlemede görünmez, üretimde sessizce boş veri döndürür.
      # Biçem denetimi: palet tek kaynakta mı, ve bir sayfanın kullandığı
      # sınıfın stili o rotaya yükleniyor mu. İkincisi 10.10.2026'da iki
      # sayfada yoktu; liste üzerinden girince doğru görünüyor, sayfa
      # yenilenince düzen dağılıyordu.
      - name: Biçem denetimi
        run: npm run check:css
      - name: Şema sözleşmesi
        run: npm run check:schema
      # Ekrandaki sayıların iki bilinen yanlış kaynağı (scripts/check-rakamlar.mjs):
      # .limit() ile sınırlı sorgudan toplam almak ve tuzak tablodan okumak.
      # İkisi de derlemede, lint'te ve şema denetiminde görünmüyor — sorgu
      # çalışıyor, sayı yazılıyor, yalnızca yanlış oluyor.
      - name: Rakam denetimi
        run: npm run check:rakamlar
      # Konsolun sayfalanmamış okumaları (scripts/check-satir-tavani.mjs):
      # PostgREST yanıtı 1.000 satırda kesiyor ve söylemiyor. Kurucu
      # ekosistemi konsoldan yönetiyor; tavana çarpılan gün aylık gelir,
      # lisans sayıları ve yenileme takvimi sessizce eksilir.
      - name: Satır tavanı denetimi
        run: npm run check:satir-tavani
      # Özet ekranlarında hatası alınmayan sorgu (scripts/check-okunamayan.mjs):
      # Supabase hata FIRLATMIYOR, error alanına yazıyor; alınmazsa sayfa
      # null veriyi "kayıt yok" diye çiziyor. 15.10.2026'da beş ekranda
      # on iki okuma böyleydi — "Açık sorun 0", "Beklenen aylık ₺0,00",
      # şişmiş tahsilat, şişmiş kâr oranı, "herkes sözleşme imzalamamış".
      - name: Okunamayan sorgu denetimi
        run: npm run check:okunamayan
      # Dilimsiz tarih biçimlendirmesi (scripts/check-saat-dilimi.mjs):
      # sunucu UTC'de çalışıyor, new Date(x).toLocaleString("tr-TR")
      # dilim verilmezse ekranda üç saat geri çıkıyor. 15.10.2026'da iş
      # detayında aynı olay üstteki listede 18:09, alttakinde 15:09
      # görünüyordu; gece 00:00–03:00 arasındaki her şey ayrıca bir
      # önceki güne düşüyor.
      - name: Saat dilimi denetimi
        run: npm run check:saat-dilimi
